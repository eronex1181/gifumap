<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Gifu CSMap & 今昔マップ</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet.locatecontrol@0.81.0/dist/L.Control.Locate.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
<style>
  html,body{height:100%;margin:0}
  #map{height:100%;background:#f3f3f3}
  .legend{background:#fff;padding:8px 12px;line-height:20px;box-shadow:0 0 15px rgba(0,0,0,.2);border-radius:5px;}
  .legend i{width:18px;height:18px;float:left;margin-right:8px;opacity:.9}
  .bus-icon{font-size:22px;width:26px;height:26px;line-height:26px;text-align:center;transform:translate(-13px,-13px);text-shadow:0 0 2px rgba(255,255,255,.85)}
</style>
</head>
<body>
<div id="map"></div>

<script>
function loadScript(src){return new Promise((ok,ng)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=ng;document.head.appendChild(s);});}
(async()=>{
  try{ await loadScript("https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"); }
  catch{ try{ await loadScript("https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"); }
         catch{ await loadScript("https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"); } }
  await loadScript("https://cdn.jsdelivr.net/npm/leaflet.locatecontrol@0.81.0/dist/L.Control.Locate.min.js");
  await loadScript("https://cdn.jsdelivr.net/npm/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js");
  init();
})();

function init(){
  // 岐阜県周辺を中心に設定
  const map = L.map('map').setView([35.5, 137.0], 11);

  // --- 重なり順（ペイン）の設定 ---
  map.createPane('boundaryPane');  map.getPane('boundaryPane').style.zIndex = 421;
  map.createPane('palePane');      map.getPane('palePane').style.zIndex = 425;
  map.createPane('zonesPane');     map.getPane('zonesPane').style.zIndex = 428;
  map.createPane('markersPane');   map.getPane('markersPane').style.zIndex = 430;

  // --- ベースマップ（CS立体図 ＆ 今昔マップ） ---
  const baseGifu = L.tileLayer('https://forestgeo.info/opendata/21_gifu/csmap_2023/{z}/{x}/{y}.webp',{maxZoom:18,attribution:'© 岐阜県'}).addTo(map);
  
  // 今昔マップ（明治期 1888-1898）※HTTPSに変更し、{-y}を使用
  const konjakuM = L.tileLayer('https://ktgis.net/kjmapw/kjtilemap/chukyo/2man/{z}/{x}/{-y}.png', {maxZoom:16, attribution:'© 今昔マップ on the web'});
  // 今昔マップ（昭和中期 1959-1960）※おまけで追加
  const konjakuS = L.tileLayer('https://ktgis.net/kjmapw/kjtilemap/chukyo/04/{z}/{x}/{-y}.png', {maxZoom:16, attribution:'© 今昔マップ on the web'});

  const gsiPale = L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png',{maxZoom:18,opacity:.6,pane:'palePane',attribution:'© 国土地理院'});
  
  // 右上の切り替えメニュー
  const ctl = L.control.layers({
    '岐阜県 CS立体図': baseGifu, 
    '今昔マップ(明治21-31年)': konjakuM,
    '今昔マップ(昭和34-35年)': konjakuS
  }, {'国土地理院地図（透過）':gsiPale}, {collapsed:false}).addTo(map);
  L.control.scale({position:'bottomleft',imperial:false}).addTo(map);

  // --- ヘルパー関数（どんなデータでも表形式でポップアップにする） ---
  const makePopup = (title, props) => {
    if(!props) return `<b>${title}</b>`;
    let rows = Object.entries(props).map(([k,v])=>`<tr><th style="white-space:nowrap;padding-right:8px;border-bottom:1px solid #ccc;text-align:left;">${k}</th><td style="border-bottom:1px solid #ccc;">${v}</td></tr>`).join('');
    return `<b>${title}</b><br><div style="max-height:250px;overflow:auto;"><table style="border-collapse:collapse;font-size:12px;">${rows}</table></div>`;
  };
  const getIcon = (color) => L.icon({iconUrl:`https://cdn.jsdelivr.net/gh/pointhi/leaflet-color-markers@master/img/marker-icon-${color}.png`, shadowUrl:'https://cdn.jsdelivr.net/gh/pointhi/leaflet-color-markers@master/img/marker-shadow.png', iconSize:[25,41],iconAnchor:[12,41],popupAnchor:[0,-35]});

  // クラスタ機能
  function registerCluster(name, layer){
    const cluster = L.markerClusterGroup({pane:'markersPane', disableClusteringAtZoom:15});
    cluster.addLayer(layer);
    map.addLayer(cluster);
    ctl.addOverlay(cluster, name);
  }

  // --- 各GeoJSONデータの読み込み ---
  const loadLayer = async (filename, layerName, options) => {
    try {
      const res = await fetch('./' + filename, {cache:'no-store'});
      if (!res.ok) return;
      const data = await res.json();
      const layer = L.geoJSON(data, {
        pane: options.pane || 'markersPane',
        style: options.style,
        pointToLayer: (f, latlng) => {
          if(options.iconHtml) return L.marker(latlng, {icon: L.divIcon({html:options.iconHtml, className:'bus-icon', iconSize:[26,26], iconAnchor:[13,13]})});
          return L.marker(latlng, {icon: getIcon(options.color || 'blue')});
        },
        onEachFeature: (f, l) => l.bindPopup(makePopup(layerName, f.properties))
      });
      if (options.cluster) registerCluster(layerName, layer);
      else { map.addLayer(layer); ctl.addOverlay(layer, layerName); }
    } catch(e) { console.log(filename + " はスキップされました"); }
  };

  // 画像2にあったファイル名をすべて指定！
  loadLayer('避難所.geojson', '避難所', {cluster: true, color: 'green'});
  loadLayer('道の駅.geojson', '道の駅', {cluster: true, color: 'violet'});
  loadLayer('バス停.geojson', 'バス停', {cluster: true, iconHtml: '🚌'});
  loadLayer('地価調査.geojson', '地価調査', {cluster: true, color: 'orange'});
  
  loadLayer('バスルート.geojson', 'バスルート', {pane: 'zonesPane', style: {color: '#1e88e5', weight: 4, opacity: 0.8}});
  loadLayer('大規模盛土.geojson', '大規模盛土', {pane: 'zonesPane', style: {color: '#d84315', weight: 2, fillOpacity: 0.4}});
  loadLayer('小学校区.geojson', '小学校区', {pane: 'boundaryPane', style: {color: '#2e7d32', weight: 2, dashArray: '5,5', fillOpacity: 0.1}});

  // part1〜part4 があれば結合して表示する処理
  Promise.all(['part1.geojson','part2.geojson','part3.geojson','part4.geojson'].map(f=>fetch('./'+f,{cache:'no-store'}).then(r=>r.ok?r.json():null).catch(()=>null)))
  .then(results => {
    const valid = results.filter(r=>r);
    if(valid.length > 0) {
      const combined = { type: "FeatureCollection", features: valid.flatMap(d=>d.features) };
      const layer = L.geoJSON(combined, {
        pane: 'zonesPane',
        style: {color: '#c62828', weight: 2, fillOpacity: 0.3},
        onEachFeature: (f,l) => l.bindPopup(makePopup('分割データ(part1-4)', f.properties))
      });
      map.addLayer(layer); ctl.addOverlay(layer, '分割データ（part1〜4）');
    }
  });

  // --- 新しい凡例（新しいデータに合わせて変更） ---
  const legend=L.control({position:'bottomright'});
  legend.onAdd=()=>{const d=L.DomUtil.create('div','legend'); d.innerHTML =
    '<img src="https://cdn.jsdelivr.net/gh/pointhi/leaflet-color-markers@master/img/marker-icon-green.png" style="height:18px;vertical-align:middle;margin-right:6px;"> 避難所<br>'+
    '<img src="https://cdn.jsdelivr.net/gh/pointhi/leaflet-color-markers@master/img/marker-icon-violet.png" style="height:18px;vertical-align:middle;margin-right:6px;"> 道の駅<br>'+
    '<span style="font-size:18px;vertical-align:middle;margin-right:6px;">🚌</span> バス停<br>'+
    '<img src="https://cdn.jsdelivr.net/gh/pointhi/leaflet-color-markers@master/img/marker-icon-orange.png" style="height:18px;vertical-align:middle;margin-right:6px;"> 地価調査<br>'+
    '<i style="background:#1e88e5;height:4px;margin-top:8px;"></i> バスルート<br>'+
    '<i style="background:#d84315;opacity:0.4;"></i> 大規模盛土<br>'+
    '<i style="background:#2e7d32;opacity:0.1;border:1px dashed #2e7d32;"></i> 小学校区<br>'+
    '<i style="background:#c62828;opacity:0.3;"></i> 分割データ(part1-4)';
    return d;};
  legend.addTo(map);

  // 現在地ボタン
  if(L.control.locate){ L.control.locate({position:'topleft',flyTo:true,strings:{title:'現在地を表示'},locateOptions:{enableHighAccuracy:true}}).addTo(map); }
}
</script>
</body>
</html>
