<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Gifu Field Map</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet.locatecontrol@0.81.0/dist/L.Control.Locate.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet-search@3.0.9/dist/leaflet-search.min.css">

<style>
html,body{height:100%;margin:0}
#map{height:100%;background:#f3f3f3}
.leaflet-control-layers{max-height:78vh;overflow:auto}

.legend{background:#fff;box-shadow:0 0 15px rgba(0,0,0,.2);border-radius:5px}
.legend-header{padding:8px 12px;cursor:pointer;font-weight:bold;font-size:14px;background:#f8f9fa;text-align:center;color:#333;border-radius:5px}
.legend-content{padding:8px 12px;line-height:22px}
.legend i{width:18px;height:18px;float:left;margin-right:8px;opacity:.9}

.map-icon{
 font-size:18px;width:30px;height:30px;line-height:30px;text-align:center;
 background:white;border-radius:50%;border:2px solid #333;
 box-shadow:0 2px 5px rgba(0,0,0,.3)
}
.search-tag{
 display:inline-block;margin:6px 6px 4px 6px;padding:2px 8px;border-radius:999px;
 font-size:12px;color:#fff;background:#e53935;line-height:1.4;
 vertical-align:middle;font-weight:bold;white-space:nowrap
}
.leaflet-control-search .search-tip-list{max-height:400px!important}

.city-label{
 background:transparent;border:none;box-shadow:none;color:#37474f;
 font-size:14px;font-weight:bold;
 text-shadow:1px 1px 0 #fff,-1px -1px 0 #fff,1px -1px 0 #fff,-1px 1px 0 #fff,0 0 4px #fff;
 white-space:nowrap
}

#pointinfo{
 position:absolute;z-index:1001;left:10px;bottom:58px;
 max-width:min(420px,calc(100vw - 24px));
 background:rgba(255,255,255,.96);border:1px solid #bbb;
 box-shadow:0 1px 5px rgba(0,0,0,.25);border-radius:6px;
 padding:8px 10px;font-size:12px;line-height:1.55;display:none;
 -webkit-user-select:text;user-select:text;cursor:text
}
#pointinfo .point-title{font-weight:700;margin-bottom:2px}
#pointinfo .point-address{word-break:break-word}
#pointinfo .point-coord,#pointinfo .plane-coord{font-family:monospace;color:#333}
#pointinfo .plane-coord{margin-top:4px}
#pointinfo .point-note{font-size:10px;color:#777;margin-top:3px}

.leaflet-control-scale{margin-left:10px!important;margin-bottom:8px!important}
.leaflet-control-scale-line{
 background:rgba(255,255,255,.92);color:#222;border-color:#555;border-top:none;
 font-size:12px;line-height:1.2;padding:2px 6px 1px;box-sizing:border-box
}
</style>
</head>
<body>
<div id="map"></div>
<div id="pointinfo"></div>

<script src="https://maps.gsi.go.jp/js/muni.js"></script>
<script src="https://cdn.jsdelivr.net/npm/proj4@2.11.0/dist/proj4.js"></script>

<script>
function loadScript(src){
 return new Promise((ok,ng)=>{
   const s=document.createElement('script');
   s.src=src;s.onload=ok;s.onerror=ng;document.head.appendChild(s);
 });
}

(async()=>{
  try{ await loadScript("https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"); }
  catch{
    try{ await loadScript("https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"); }
    catch{ await loadScript("https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"); }
  }
  await loadScript("https://cdn.jsdelivr.net/npm/leaflet.locatecontrol@0.81.0/dist/L.Control.Locate.min.js");
  await loadScript("https://cdn.jsdelivr.net/npm/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js");
  await loadScript("https://cdn.jsdelivr.net/npm/leaflet-search@3.0.9/dist/leaflet-search.min.js");
  init();
})();

function init(){
  const map=L.map('map',{preferCanvas:true,maxZoom:28}).setView([35.5,137.0],11);

  // ---------- Panes ----------
  map.createPane('csPane');       map.getPane('csPane').style.zIndex=410;
  map.createPane('waterPane');    map.getPane('waterPane').style.zIndex=416;
  map.getPane('waterPane').style.pointerEvents='none';
  map.createPane('boundaryPane'); map.getPane('boundaryPane').style.zIndex=421;
  map.createPane('zonesPane');    map.getPane('zonesPane').style.zIndex=428;
  map.createPane('markersPane');  map.getPane('markersPane').style.zIndex=450;

  // ---------- Background maps ----------
  const gsiPale=L.tileLayer(
    'https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png',
    {maxNativeZoom:18,maxZoom:28,attribution:'© 国土地理院'}
  );
  const gsiStd=L.tileLayer(
    'https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png',
    {maxNativeZoom:18,maxZoom:28,attribution:'© 国土地理院'}
  );
  const gsiPhoto=L.tileLayer(
    'https://cyberjapandata.gsi.go.jp/xyz/seamlessphoto/{z}/{x}/{y}.jpg',
    {maxNativeZoom:18,maxZoom:28,attribution:'© 国土地理院'}
  );
  const konjakuM=L.tileLayer(
    'https://ktgis.net/kjmapw/kjtilemap/chukyo/2man/{z}/{x}/{-y}.png',
    {minZoom:8,maxNativeZoom:16,maxZoom:28,attribution:'© 今昔マップ on the web'}
  );

  // 岐阜県CS立体図：元タイルの最大ズームを超えても拡大表示を継続
  const baseGifu=L.tileLayer(
    'https://forestgeo.info/opendata/21_gifu/csmap_2023/{z}/{x}/{y}.webp',
    {minZoom:2,maxNativeZoom:18,maxZoom:28,opacity:.60,pane:'csPane',attribution:'© 岐阜県'}
  );

  // ---------- Water hazards 1–6 ----------
  function waterTile(url,opacity=.70){
    return L.tileLayer(url,{
      minZoom:2,maxNativeZoom:17,maxZoom:28,
      opacity,pane:'waterPane',attribution:'ハザードマップポータルサイト © 国土地理院'
    });
  }

  const floodL2=waterTile(
    'https://disaportaldata.gsi.go.jp/raster/01_flood_l2_shinsuishin_data/{z}/{x}/{y}.png'
  );
  const houseFlood=waterTile(
    'https://disaportaldata.gsi.go.jp/raster/01_flood_l2_kaokutoukai_hanran_data/{z}/{x}/{y}.png',.75
  );
  const houseErosion=waterTile(
    'https://disaportaldata.gsi.go.jp/raster/01_flood_l2_kaokutoukai_kagan_data/{z}/{x}/{y}.png',.75
  );
  const inlandFlood=waterTile(
    'https://disaportaldata.gsi.go.jp/raster/02_naisui_data/{z}/{x}/{y}.png'
  );
  const stormSurge=waterTile(
    'https://disaportaldata.gsi.go.jp/raster/03_hightide_l2_shinsuishin_data/{z}/{x}/{y}.png'
  );
  const tsunami=waterTile(
    'https://disaportaldata.gsi.go.jp/raster/04_tsunami_newlegend_data/{z}/{x}/{y}.png'
  );

  // 背景地図もチェック式。全部OFF可、同時表示は1枚のみ。
  const backgroundMaps={
    '国土地理院（淡色）':gsiPale,
    '国土地理院（標準）':gsiStd,
    '国土地理院（航空写真）':gsiPhoto,
    '今昔マップ（明治期）':konjakuM
  };

  const overlays={
    ...backgroundMaps,
    '岐阜県CS立体図（2023年）':baseGifu,
    '① 洪水浸水想定区域（想定最大規模）':floodL2,
    '② 家屋倒壊等氾濫想定区域（氾濫流）':houseFlood,
    '③ 家屋倒壊等氾濫想定区域（河岸侵食）':houseErosion,
    '④ 内水（雨水出水）浸水想定区域':inlandFlood,
    '⑤ 高潮浸水想定区域':stormSurge,
    '⑥ 津波浸水想定':tsunami
  };

  gsiPale.addTo(map);
  const ctl=L.control.layers({},overlays,{collapsed:false}).addTo(map);

  const backgroundLayerSet=new Set(Object.values(backgroundMaps));
  let changingBackground=false;
  map.on('overlayadd',e=>{
    if(changingBackground||!backgroundLayerSet.has(e.layer))return;
    changingBackground=true;
    backgroundLayerSet.forEach(layer=>{
      if(layer!==e.layer&&map.hasLayer(layer))map.removeLayer(layer);
    });
    changingBackground=false;
  });

  L.control.scale({
    position:'bottomleft',metric:true,imperial:false,maxWidth:150
  }).addTo(map);

  // ---------- Helpers ----------
  function esc(v){
    return String(v??'').replace(/[&<>"']/g,c=>({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }

  function mapLinks(latlng){
    if(!latlng)return '';
    const lat=Number(latlng.lat),lng=Number(latlng.lng);
    if(!Number.isFinite(lat)||!Number.isFinite(lng))return '';
    return `<div style="margin-top:10px;display:flex;gap:6px">
      <a href="https://www.google.com/maps/search/?api=1&query=${lat},${lng}" target="_blank" rel="noopener"
       style="flex:1;text-align:center;background:#4285F4;color:#fff;padding:6px 4px;border-radius:4px;text-decoration:none;font-size:11px;font-weight:bold">Googleマップ</a>
      <a href="https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=${lat},${lng}" target="_blank" rel="noopener"
       style="flex:1;text-align:center;background:#ea4335;color:#fff;padding:6px 4px;border-radius:4px;text-decoration:none;font-size:11px;font-weight:bold">ストリートビュー</a>
    </div>`;
  }

  function popupTable(rows){
    const body=rows
      .filter(([k,v])=>v!==null&&v!==undefined&&String(v).trim()!=='')
      .map(([k,v])=>`<tr>
        <th style="white-space:nowrap;padding:5px 10px 5px 0;border-bottom:1px solid #ddd;text-align:left;vertical-align:top">${esc(k)}</th>
        <td style="padding:5px 0;border-bottom:1px solid #ddd">${v}</td>
      </tr>`).join('');
    return `<table style="border-collapse:collapse;font-size:12px;width:100%">${body}</table>`;
  }

  function genericPopup(title,props,latlng){
    const rows=Object.entries(props||{})
      .filter(([k,v])=>k!=='_searchKey'&&v!==null&&v!==undefined&&String(v).trim()!=='')
      .map(([k,v])=>[k,esc(v)]);
    return `<b>${esc(title)}</b>${popupTable(rows)}${mapLinks(latlng)}`;
  }

  // ---------- Shelter popup: same style as Chiba ----------
  function evacuationPopup(p,latlng){
    const disasterFields=[
      ['洪水','洪水'],
      ['崖崩れ、土石流及び地滑り','崖崩れ・土石流・地滑り'],
      ['高潮','高潮'],
      ['地震','地震'],
      ['津波','津波'],
      ['大規模な火事','大規模な火事'],
      ['内水氾濫','内水氾濫'],
      ['火山現象','火山現象']
    ];

    const hazards=disasterFields
      .filter(([key])=>{
        const v=p?.[key];
        return v!==null&&v!==undefined&&String(v).trim()!==''&&String(v).trim()!=='0';
      })
      .map(([,label])=>label);

    const same=String(p?.['指定避難所との住所同一']??'').trim();
    const sameText=same==='1'?'指定避難所と同一住所':(same===''?'':esc(same));

    const rows=[
      ['施設・場所名',esc(p?.['施設・場所名']||'')],
      ['住所',esc(p?.['住所']||'')],
      ['対応する災害',hazards.map(esc).join('、')],
      ['指定避難所',sameText],
      ['備考',esc(p?.['備考']||'')]
    ];

    return `<b>避難場所・指定緊急避難場所</b>`+
      popupTable(rows)+
      `<div style="margin-top:6px;color:#666;font-size:10px">出典：国土地理院</div>`+
      mapLinks(latlng);
  }

  // ---------- Soil-hazard popup: same style as Chiba ----------
  function hazardPopup(p,latlng){
    const code=Number(p?.['現象']??p?.A33_001);
    const phenomenon=
      code===1?'急傾斜地の崩壊':
      code===2?'土石流':
      code===3?'地滑り':'不明';

    const rows=[
      ['現象の種類',esc(phenomenon)],
      ['箇所番号',esc(p?.['箇所番号']??p?.A33_004??'')],
      ['箇所名',esc(p?.['箇所名']??p?.A33_005??'')],
      ['公示年月日',esc(p?.['告示年月日']??p?.['公示年月日']??p?.A33_007??'')]
    ];

    return popupTable(rows)+mapLinks(latlng);
  }

  // ---------- Generic point layers ----------
  async function loadPointLayer(filename,layerName,options={}){
    try{
      const res=await fetch('./'+encodeURI(filename),{cache:'no-store'});
      if(!res.ok)throw new Error(`${res.status} ${res.statusText}`);
      const data=await res.json();

      const geo=L.geoJSON(data,{
        pane:'markersPane',
        pointToLayer:(f,ll)=>L.marker(ll,{
          pane:'markersPane',
          icon:L.divIcon({
            html:`<div class="map-icon" style="color:${options.iconColor||'black'};font-size:${options.fontSize||'18px'}">${options.iconHtml||''}</div>`,
            className:'',iconSize:[30,30],iconAnchor:[15,15]
          }),
          title:options.titleField?String(f.properties?.[options.titleField]||''):''
        }),
        onEachFeature:(f,l)=>{
          const ll=l.getLatLng();
          const html=options.popupFormatter
            ? options.popupFormatter(f.properties||{},ll)
            : genericPopup(layerName,f.properties||{},ll);
          l.bindPopup(html,{maxWidth:430,minWidth:260});
        }
      });

      const cluster=L.markerClusterGroup({
        disableClusteringAtZoom:15,
        showCoverageOnHover:false,
        chunkedLoading:true
      });
      cluster.addLayers(geo.getLayers());
      if(options.defaultOn)map.addLayer(cluster);
      ctl.addOverlay(cluster,layerName);
    }catch(e){
      console.error(filename+' 読み込み失敗:',e);
    }
  }

  loadPointLayer('kuma.geojson','熊出没（過去５年）',{
    iconHtml:'🐻',iconColor:'#5d4037',fontSize:'20px',defaultOn:true
  });

  loadPointLayer('避難所.geojson','避難所・指定緊急避難場所',{
    iconHtml:'<i class="fa-solid fa-person-running"></i>',
    iconColor:'#2e7d32',
    titleField:'施設・場所名',
    popupFormatter:evacuationPopup
  });

  loadPointLayer('道の駅.geojson','道の駅（全国2018年）',{
    iconHtml:'<i class="fa-solid fa-car-side"></i>',iconColor:'#6a1b9a'
  });
  loadPointLayer('バス停.geojson','バス停（2023年）',{iconHtml:'🚌'});
  loadPointLayer('地価調査.geojson','地価（2025年）',{
    iconHtml:'<i class="fa-solid fa-yen-sign"></i>',iconColor:'#e65100'
  });

  // ---------- Soil hazard polygons ----------
  const soilFiles=['part1.geojson','part2.geojson','part3.geojson','part4.geojson','part5.geojson','part6.geojson','part7.geojson'];

  Promise.all(
    soilFiles.map(file=>
      fetch('./'+file,{cache:'no-store'})
        .then(r=>r.ok?r.json():null)
        .catch(()=>null)
    )
  ).then(results=>{
    const valid=results.filter(Boolean);
    if(!valid.length)return;

    const combined={type:'FeatureCollection',features:valid.flatMap(d=>d.features||[])};

    const soilLayer=L.geoJSON(combined,{
      pane:'zonesPane',
      style:f=>{
        const zone=Number(f.properties?.['区分']??f.properties?.A33_002);
        if(zone===1||zone===3){
          return {color:'#d6b800',fillColor:'#ffff00',weight:1.5,opacity:.95,fillOpacity:.35};
        }
        if(zone===2||zone===4){
          return {color:'#c40000',fillColor:'#ff0000',weight:1.5,opacity:.95,fillOpacity:.38};
        }
        return {color:'#777',fillColor:'#aaa',weight:1.2,fillOpacity:.15};
      },
      onEachFeature:(f,l)=>{
        const p=f.properties||{};
        const num=p['箇所番号']??p.A33_004??'';
        const name=p['箇所名']??p.A33_005??'';
        const addr=p['住所']??p['所在地']??p.A33_009??'';
        p._searchKey=`${num} ${name} ${addr}`.trim();

        const center=l.getBounds?l.getBounds().getCenter():null;
        l.bindPopup(hazardPopup(p,center),{maxWidth:360,minWidth:260});

        l.on('click',e=>{
          if(e.originalEvent)L.DomEvent.stopPropagation(e.originalEvent);
          l.setPopupContent(hazardPopup(p,e.latlng||center));
          l.openPopup();
        });
      }
    }).addTo(map);

    ctl.addOverlay(soilLayer,'土砂災害警戒区域・特別警戒区域（2025年）');

    if(L.Control.Search){
      const searchCtrl=new L.Control.Search({
        layer:soilLayer,
        propertyName:'_searchKey',
        textPlaceholder:'箇所番号 / 箇所名 / 住所',
        marker:false,zoom:16,collapsed:window.innerWidth<600,initial:false
      }).addTo(map);

      searchCtrl.on('search:locationfound',e=>{
        if(e.layer?.getBounds)map.fitBounds(e.layer.getBounds(),{maxZoom:16,padding:[20,20]});
        else if(e.latlng)map.setView(e.latlng,16);
        if(e.layer?.openPopup)e.layer.openPopup();
      });

      const el=searchCtrl._container||searchCtrl.getContainer();
      const tag=document.createElement('span');
      tag.className='search-tag';
      tag.textContent='⚠️ 土砂災害検索';
      (el.querySelector('form')||el).insertBefore(tag,el.firstChild);
    }
  }).catch(console.error);

  // ---------- Other existing polygon layers ----------
  const otherStyles={
    'PREF_岐阜県.geojson':{name:'国土基本図郭',color:'#0288d1',weight:1.2,fillOpacity:0},
    '旧市町村.geojson':{name:'旧市町村境界',color:'#546e7a',weight:1.2,fillOpacity:.1,defaultOn:true,labelField:'city1',labelClass:'city-label'},
    '大規模盛土.geojson':{name:'大規模盛土（2023年）',color:'#d84315',fillOpacity:.2},
    '小学校区.geojson':{name:'小学校区（2023年）',color:'#2e7d32',dash:'5,5',fillOpacity:.1},
    '概略調査_土石流.geojson':{name:'概略調査_土石流',color:'#8e24aa',weight:3,fillOpacity:.3},
    '概略調査_急傾斜.geojson':{name:'概略調査_急傾斜',color:'#8e24aa',weight:3,fillOpacity:.3},
    '追加図化案.geojson':{name:'追加図化案',color:'black',weight:2,fillOpacity:0},
    '既存砂防基盤図範囲.geojson':{name:'既存砂防基盤図範囲',color:'red',weight:2,fillOpacity:0},
    '@tatemono.geojson':{name:'砂防基盤図建物',color:'green',weight:2,fillOpacity:0}
  };

  Object.entries(otherStyles).forEach(([file,opt])=>{
    const layer=L.geoJSON(null,{
      pane:(file.includes('区')||file.includes('旧')||file.includes('図郭'))?'boundaryPane':'zonesPane',
      style:{
        color:opt.color,weight:opt.weight||2,dashArray:opt.dash||'',
        fillOpacity:opt.fillOpacity!==undefined?opt.fillOpacity:.2
      },
      onEachFeature:(f,l)=>{
        const center=l.getBounds?l.getBounds().getCenter():null;
        l.bindPopup(genericPopup(opt.name,f.properties||{},center));
      }
    });

    if(opt.defaultOn)map.addLayer(layer);
    ctl.addOverlay(layer,opt.name);

    fetch('./'+encodeURI(file),{cache:'no-store'})
      .then(r=>{
        if(!r.ok)throw new Error(`${r.status} ${r.statusText}`);
        return r.json();
      })
      .then(data=>{
        layer.addData(data);

        if(opt.labelField){
          layer.eachLayer(sub=>{
            const p=sub.feature?.properties;
            if(!p||!sub.getBounds)return;
            const key=Object.keys(p).find(k=>k.toLowerCase()===opt.labelField.toLowerCase());
            const labelText=key?p[key]:null;
            if(!labelText)return;

            const center=sub.getBounds().getCenter();
            const icon=L.divIcon({
              className:opt.labelClass||'city-label',
              html:`<span style="position:relative;left:-50%">${esc(labelText)}</span>`,
              iconSize:[0,0]
            });
            L.marker(center,{icon,interactive:false,pane:'markersPane'}).addTo(layer);
          });
        }
      })
      .catch(e=>console.error(file+' 読み込み失敗:',e));
  });

  // =====================================================
  // Clicked point: address / lat-lng / JGD2011 plane coordinate
  // Hand-written prefecture mapping + geographic fallback
  // =====================================================
  let pointInfoSeq=0;
  let lastPointInfo=null;

  const PLANE_SYSTEMS={
    1:{roman:'I',epsg:'EPSG:6669',lat0:33,lon0:129.5},
    2:{roman:'II',epsg:'EPSG:6670',lat0:33,lon0:131},
    3:{roman:'III',epsg:'EPSG:6671',lat0:36,lon0:132+10/60},
    4:{roman:'IV',epsg:'EPSG:6672',lat0:33,lon0:133.5},
    5:{roman:'V',epsg:'EPSG:6673',lat0:36,lon0:134+20/60},
    6:{roman:'VI',epsg:'EPSG:6674',lat0:36,lon0:136},
    7:{roman:'VII',epsg:'EPSG:6675',lat0:36,lon0:137+10/60},
    8:{roman:'VIII',epsg:'EPSG:6676',lat0:36,lon0:138.5},
    9:{roman:'IX',epsg:'EPSG:6677',lat0:36,lon0:139+50/60},
    10:{roman:'X',epsg:'EPSG:6678',lat0:40,lon0:140+50/60},
    11:{roman:'XI',epsg:'EPSG:6679',lat0:44,lon0:140.25},
    12:{roman:'XII',epsg:'EPSG:6680',lat0:44,lon0:142.25},
    13:{roman:'XIII',epsg:'EPSG:6681',lat0:44,lon0:144.25},
    14:{roman:'XIV',epsg:'EPSG:6682',lat0:26,lon0:142},
    15:{roman:'XV',epsg:'EPSG:6683',lat0:26,lon0:127.5},
    16:{roman:'XVI',epsg:'EPSG:6684',lat0:26,lon0:124},
    17:{roman:'XVII',epsg:'EPSG:6685',lat0:26,lon0:131},
    18:{roman:'XVIII',epsg:'EPSG:6686',lat0:20,lon0:136},
    19:{roman:'XIX',epsg:'EPSG:6687',lat0:26,lon0:154}
  };

  if(window.proj4){
    Object.values(PLANE_SYSTEMS).forEach(s=>{
      proj4.defs(
        s.epsg,
        `+proj=tmerc +lat_0=${s.lat0} +lon_0=${s.lon0} +k=0.9999 +x_0=0 +y_0=0 +ellps=GRS80 +units=m +no_defs`
      );
    });
  }

  const PREF_CODE_NAME={
    '01':'北海道','02':'青森県','03':'岩手県','04':'宮城県','05':'秋田県','06':'山形県','07':'福島県',
    '08':'茨城県','09':'栃木県','10':'群馬県','11':'埼玉県','12':'千葉県','13':'東京都','14':'神奈川県',
    '15':'新潟県','16':'富山県','17':'石川県','18':'福井県','19':'山梨県','20':'長野県','21':'岐阜県',
    '22':'静岡県','23':'愛知県','24':'三重県','25':'滋賀県','26':'京都府','27':'大阪府','28':'兵庫県',
    '29':'奈良県','30':'和歌山県','31':'鳥取県','32':'島根県','33':'岡山県','34':'広島県','35':'山口県',
    '36':'徳島県','37':'香川県','38':'愛媛県','39':'高知県','40':'福岡県','41':'佐賀県','42':'長崎県',
    '43':'熊本県','44':'大分県','45':'宮崎県','46':'鹿児島県','47':'沖縄県'
  };

  const PREF_CODE_PLANE={
    '02':10,'03':10,'04':10,'05':10,'06':10,
    '07':9,'08':9,'09':9,'10':9,'11':9,'12':9,'14':9,
    '15':8,'19':8,'20':8,'22':8,
    '16':7,'17':7,'21':7,'23':7,
    '18':6,'24':6,'25':6,'26':6,'27':6,'29':6,'30':6,
    '28':5,'31':5,'33':5,
    '36':4,'37':4,'38':4,'39':4,
    '32':3,'34':3,'35':3,
    '40':2,'41':2,'43':2,'44':2,'45':2,
    '42':1
  };

  function normalizeMuniCode(code){
    const s=String(code??'').replace(/\D/g,'');
    return s?s.padStart(5,'0'):'';
  }

  function prefCodeFromMuni(code){
    const s=normalizeMuniCode(code);
    return s.length>=2?s.slice(0,2):'';
  }

  function municipalityPartsFromCode(code){
    const prefCode=prefCodeFromMuni(code);
    const fallbackPref=PREF_CODE_NAME[prefCode]||'';
    try{
      const raw=window.GSI?.MUNI_ARRAY?.[String(code)]||
                window.GSI?.MUNI_ARRAY?.[normalizeMuniCode(code)];
      if(raw){
        const parts=String(raw).split(',');
        return {pref:parts[1]||fallbackPref,muni:parts[3]||'',prefCode};
      }
    }catch(e){}
    return {pref:fallbackPref,muni:'',prefCode};
  }

  function planeSystemFromPrefCode(prefCode,lat,lng){
    if(prefCode==='01'){
      if(lng<141.5)return 11;
      if(lng<143.5)return 12;
      return 13;
    }
    if(prefCode==='13'){
      if(lat>=33.5)return 9;
      if(lng>=150)return 19;
      if(lat<24)return 18;
      return 14;
    }
    if(prefCode==='46'){
      const islandZone1=(lat>=27&&lat<=32&&lng>=128.3&&lng<=130.3);
      return islandZone1?1:2;
    }
    if(prefCode==='47'){
      if(lng<126)return 16;
      if(lng>130)return 17;
      return 15;
    }
    return PREF_CODE_PLANE[prefCode]||null;
  }

  function planeSystemFromLatLngFallback(lat,lng){
    // 岐阜・石川・富山・愛知付近 → VII系
    if(lat>=34.5&&lat<=38.2&&lng>=135.8&&lng<=138.1)return 7;
    // 長野・山梨・静岡東部付近 → VIII系
    if(lat>=34.4&&lat<=37.6&&lng>138.1&&lng<=139.7)return 8;
    // 千葉・関東付近 → IX系
    if(lat>=34.5&&lat<=37.6&&lng>139.0&&lng<=141.1)return 9;
    if(lat>=41.3&&lat<=45.8){
      if(lng<141.5)return 11;
      if(lng<143.5)return 12;
      return 13;
    }
    return null;
  }

  function toPlaneRect(lat,lng,systemNo){
    if(!window.proj4||!systemNo)return null;
    const sys=PLANE_SYSTEMS[systemNo];
    if(!sys)return null;
    try{
      const [easting,northing]=proj4('EPSG:4326',sys.epsg,[lng,lat]);
      if(!Number.isFinite(easting)||!Number.isFinite(northing))return null;
      return {systemNo,roman:sys.roman,epsg:sys.epsg,x:northing,y:easting};
    }catch(e){
      console.warn('平面直角座標変換に失敗:',e);
      return null;
    }
  }

  function renderPointInfo(panel,info,addressText,note=''){
    const plane=info.plane;
    const planeHtml=plane
      ? `<div class="plane-coord">平面直角座標 第${plane.roman}系（JGD2011）<br>X：${plane.x.toFixed(3)} m<br>Y：${plane.y.toFixed(3)} m</div>`
      : `<div class="plane-coord">平面直角座標：系番号を判定できません</div>`;

    panel.innerHTML=
      `<div class="point-title">クリック地点</div>`+
      `<div class="point-address">住所：${addressText}</div>`+
      `<div class="point-coord">緯度：${info.lat.toFixed(7)}<br>経度：${info.lng.toFixed(7)}</div>`+
      planeHtml+
      (note?`<div class="point-note">${note}</div>`:'');
  }

  async function showClickedPointInfo(latlng){
    if(!latlng)return;
    const panel=document.getElementById('pointinfo');
    if(!panel)return;

    const lat=Number(latlng.lat),lng=Number(latlng.lng);
    if(!Number.isFinite(lat)||!Number.isFinite(lng))return;

    const seq=++pointInfoSeq;
    const fallbackSystem=planeSystemFromLatLngFallback(lat,lng);
    const fallbackPlane=toPlaneRect(lat,lng,fallbackSystem);

    lastPointInfo={lat,lng,plane:fallbackPlane,address:'',pref:'',muni:''};

    panel.style.display='block';
    renderPointInfo(
      panel,lastPointInfo,'取得中…',
      fallbackPlane
        ? `平面直角座標：位置から第${fallbackPlane.roman}系を仮判定`
        : '住所取得後に平面直角座標系を判定します'
    );

    try{
      const url=`https://mreversegeocoder.gsi.go.jp/reverse-geocoder/LonLatToAddress?lat=${encodeURIComponent(lat)}&lon=${encodeURIComponent(lng)}`;
      const r=await fetch(url,{cache:'no-store'});
      if(!r.ok)throw new Error(`HTTP ${r.status}`);
      const j=await r.json();
      if(seq!==pointInfoSeq)return;

      const result=j?.results||{};
      const parts=municipalityPartsFromCode(result.muniCd);
      const town=String(result.lv01Nm||'').trim();
      const address=`${parts.pref}${parts.muni}${town}`.trim();

      let systemNo=planeSystemFromPrefCode(parts.prefCode,lat,lng);
      if(!systemNo)systemNo=planeSystemFromLatLngFallback(lat,lng);
      const plane=toPlaneRect(lat,lng,systemNo);

      lastPointInfo.address=address;
      lastPointInfo.pref=parts.pref;
      lastPointInfo.muni=parts.muni;
      lastPointInfo.plane=plane;

      renderPointInfo(
        panel,lastPointInfo,
        address?esc(address):(town?esc(town):'住所情報なし'),
        plane
          ? `住所：国土地理院リバースジオコーダ ／ 平面直角座標系：第${plane.roman}系（${plane.epsg}）`
          : '住所：国土地理院リバースジオコーダ ／ 平面直角座標系を判定できませんでした'
      );
    }catch(err){
      if(seq!==pointInfoSeq)return;
      renderPointInfo(
        panel,lastPointInfo,'取得できませんでした',
        lastPointInfo.plane
          ? `住所取得失敗 ／ 平面直角座標は位置から第${lastPointInfo.plane.roman}系を判定`
          : '住所・平面直角座標系を判定できませんでした'
      );
      console.warn('住所の逆ジオコーディングに失敗:',err);
    }
  }

  map.getContainer().addEventListener('click',ev=>{
    const target=ev.target;
    if(target?.closest?.('.leaflet-control,.leaflet-popup,.leaflet-tooltip,#pointinfo'))return;
    try{
      showClickedPointInfo(map.mouseEventToLatLng(ev));
    }catch(e){}
  },true);

  // ---------- Legend ----------
  const legend=L.control({position:'bottomright'});
  legend.onAdd=()=>{
    const d=L.DomUtil.create('div','legend');
    L.DomEvent.disableClickPropagation(d);
    d.innerHTML=`
      <div class="legend-header" id="legend-header">▼ 凡例を閉じる</div>
      <div class="legend-content" id="legend-content">
        🐻 熊出没（過去５年）<br>
        <i class="fa-solid fa-person-running" style="color:#2e7d32"></i> 避難所<br>
        <i class="fa-solid fa-car-side" style="color:#6a1b9a"></i> 道の駅（全国2018年）<br>
        🚌 バス停（2023年）<br>
        <i class="fa-solid fa-yen-sign" style="color:#e65100"></i> 地価（2025年）<br>
        <i style="background:#ffff00;opacity:.7;border:1px solid #cca300"></i> 土砂災害：警戒区域<br>
        <i style="background:#ff0000;opacity:.7;border:1px solid #cc0000"></i> 土砂災害：特別警戒区域<br>
        <i style="background:transparent;border:1px solid #546e7a"></i> 旧市町村境界<br>
        <i style="background:transparent;border:1px solid #0288d1"></i> 国土基本図郭<br>
        <i style="background:#8e24aa;opacity:.3;border:2px solid #8e24aa"></i> 概略調査_土石流<br>
        <i style="background:#8e24aa;opacity:.3;border:2px solid #8e24aa"></i> 概略調査_急傾斜<br>
        <i style="background:transparent;border:2px solid black"></i> 追加図化案<br>
        <i style="background:transparent;border:2px solid red"></i> 既存砂防基盤図範囲<br>
        <i style="background:transparent;border:2px solid green"></i> 砂防基盤図建物
      </div>`;

    const header=d.querySelector('#legend-header');
    const content=d.querySelector('#legend-content');
    header.onclick=()=>{
      if(content.style.display==='none'){
        content.style.display='block';header.innerText='▼ 凡例を閉じる';
      }else{
        content.style.display='none';header.innerText='▲ 凡例を開く';
      }
    };
    if(window.innerWidth<600){
      content.style.display='none';
      header.innerText='▲ 凡例を開く';
    }
    return d;
  };
  legend.addTo(map);

  if(L.control.locate){
    L.control.locate({
      position:'topleft',flyTo:true,
      strings:{title:'現在地を表示'},
      locateOptions:{enableHighAccuracy:true}
    }).addTo(map);
  }
}
</script>
</body>
