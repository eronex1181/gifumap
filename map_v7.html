<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Gifu Field Map</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet.locatecontrol@0.81.0/dist/L.Control.Locate.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
<style>
  html,body{height:100%;margin:0}
  #map{height:100%;background:#f3f3f3}
  .legend{background:#fff;padding:8px 12px;line-height:22px;box-shadow:0 0 15px rgba(0,0,0,.2);border-radius:5px;}
  .legend i{width:18px;height:18px;float:left;margin-right:8px;opacity:.9}
  .map-icon {
    font-size: 18px; width: 30px; height: 30px; line-height: 30px; text-align: center;
    background: white; border-radius: 50%; border: 2px solid #333;
    transform: translate(-15px, -15px); box-shadow: 0 2px 5px rgba(0,0,0,0.3);
  }
</style>
</head>
<body>
<div id="map"></div>

<script>
function loadScript(src){return new Promise((ok,ng)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=ng;document.head.appendChild(s);});}
(async()=>{
  try{ await loadScript("https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"); }
  catch{ try{ await loadScript("https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"); }
         catch{ await loadScript("https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"); } }
  await loadScript("https://cdn.jsdelivr.net/npm/leaflet.locatecontrol@0.81.0/dist/L.Control.Locate.min.js");
  await loadScript("https://cdn.jsdelivr.net/npm/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js");
  init();
})();

function init(){
  const map = L.map('map').setView([35.5, 137.0], 11);

  // --- 重なり順（ペイン）の設定 ---
  map.createPane('csPane');        map.getPane('csPane').style.zIndex = 410;
  map.createPane('boundaryPane');  map.getPane('boundaryPane').style.zIndex = 421;
  map.createPane('zonesPane');     map.getPane('zonesPane').style.zIndex = 428;
  map.createPane('markersPane');   map.getPane('markersPane').style.zIndex = 450;

  // --- ベースマップ ---
  const gsiPale = L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png',{maxZoom:18,attribution:'© 国土地理院'}).addTo(map);
  const gsiPhoto = L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/seamlessphoto/{z}/{x}/{y}.jpg',{maxZoom:18,attribution:'© 国土地理院'});
  const konjakuM = L.tileLayer('https://ktgis.net/kjmapw/kjtilemap/chukyo/2man/{z}/{x}/{-y}.png', {maxZoom:16, attribution:'© 今昔マップ'});

  // --- 重ねるタイルデータ（初期状態はOFF） ---
  const baseGifu = L.tileLayer('https://forestgeo.info/opendata/21_gifu/csmap_2023/{z}/{x}/{y}.webp',{
    maxZoom:18, opacity: 0.6, pane: 'csPane', attribution:'© 岐阜県'
  });
  
  // 新規追加：洪水・内水ハザードマップ（国土地理院）透過率を0.7に設定して下の地図を見えやすく
  const floodL2 = L.tileLayer('https://disaportaldata.gsi.go.jp/raster/01_flood_l2_shinsuishin_data/{z}/{x}/{y}.png',{
    maxZoom:17, opacity: 0.7, attribution:'© 国土地理院'
  });
  const naisui = L.tileLayer('https://disaportaldata.gsi.go.jp/raster/02_naisui_pref_data/21/{z}/{x}/{y}.png',{
    maxZoom:17, opacity: 0.7, attribution:'© 国土地理院'
  });

  const ctl = L.control.layers({
    '国土地理院（淡色）': gsiPale,
    '国土地理院（航空写真）': gsiPhoto,
    '今昔マップ（明治期）': konjakuM
  }, {
    '岐阜県CS立体図（2022年）': baseGifu,
    '洪水浸水想定区域（想定最大規模2020年）': floodL2,
    '内水（雨水出水）浸水想定区域（2020年）': naisui
  }, {collapsed:false}).addTo(map);
  L.control.scale({position:'bottomleft',imperial:false}).addTo(map);

  // --- ポップアップヘルパー ---
  const makePopup = (title, props) => {
    let rows = Object.entries(props).map(([k,v])=>`<tr><th style="white-space:nowrap;padding-right:8px;border-bottom:1px solid #ccc;text-align:left;">${k}</th><td style="border-bottom:1px solid #ccc;">${v}</td></tr>`).join('');
    return `<b>${title}</b><br><div style="max-height:250px;overflow:auto;"><table style="border-collapse:collapse;font-size:12px;">${rows}</table></div>`;
  };

  // --- GeoJSONデータ読み込み関数 ---
  const loadLayer = async (filename, layerName, options) => {
    try {
      const res = await fetch('./' + filename, {cache:'no-store'});
      if (!res.ok) return;
      const data = await res.json();
      const layer = L.geoJSON(data, {
        pane: options.pane || 'markersPane',
        pointToLayer: (f, latlng) => {
          return L.marker(latlng, {icon: L.divIcon({
            html: `<div class="map-icon" style="color:${options.iconColor || 'black'}; font-size:${options.fontSize||'18px'};">${options.iconHtml}</div>`,
            className: '', iconSize: [30,30]
          })});
        },
        onEachFeature: (f, l) => l.bindPopup(makePopup(layerName, f.properties))
      });
      const cluster = L.markerClusterGroup({pane:'markersPane', disableClusteringAtZoom:15});
      cluster.addLayer(layer);
      
      if(options.defaultOn) map.addLayer(cluster);
      ctl.addOverlay(cluster, layerName);
    } catch(e) { console.log(filename + " 読み込み失敗"); }
  };

  // 1. 熊出没 (絵文字の🐻アイコン・少し大きめ・デフォルトON)
  loadLayer('kuma.geojson', '熊出没（過去５年）', {iconHtml: '🐻', iconColor: '#5d4037', fontSize: '20px', defaultOn: true});
  
  // 2. ピンデータ (初期表示はOFF)
  loadLayer('避難所.geojson', '避難所', {iconHtml: '<i class="fa-solid fa-person-running"></i>', iconColor: '#2e7d32'});
  loadLayer('道の駅.geojson', '道の駅（全国2018年）', {iconHtml: '<i class="fa-solid fa-car-side"></i>', iconColor: '#6a1b9a'});
  loadLayer('バス停.geojson', 'バス停（2023年）', {iconHtml: '🚌'});
  // 3. 地価データの復活
  loadLayer('地価調査.geojson', '地価（2025年）', {iconHtml: '<i class="fa-solid fa-yen-sign"></i>', iconColor: '#e65100'});

  // 土砂災害データ (デフォルトON)
  Promise.all(['part1.geojson','part2.geojson','part3.geojson','part4.geojson'].map(f=>fetch('./'+f,{cache:'no-store'}).then(r=>r.ok?r.json():null).catch(()=>null)))
  .then(results => {
    const valid = results.filter(r=>r);
    if(valid.length > 0) {
      const combined = { type: "FeatureCollection", features: valid.flatMap(d=>d.features) };
      const layer = L.geoJSON(combined, {
        pane: 'zonesPane',
        style: (f) => {
          const zoneVal = f.properties['区分'] ?? f.properties.A33_002;
          let col = (zoneVal == 1 || zoneVal == 3 || zoneVal == '1' || zoneVal == '3') ? '#ffff00' : '#ff0000';
          return {color: col, fillColor: col, weight: 1.5, fillOpacity: 0.5};
        },
        onEachFeature: (f, l) => {
          const p = f.properties ?? {};
          const d = {};
          Object.entries(p).forEach(([k, v]) => {
            if (k === '現象' || k === 'A33_001') {
              let n = v;
              if (v == 1) n='急傾斜'; if (v == 2) n='土石流'; if (v == 3) n='地すべり';
              d['現象'] = n;
            } else if (k === '区分' || k === 'A33_002') {
              let n = v;
              if (v == 1 || v == 3) n='イエローゾーン'; if (v == 2 || v == 4) n='レッドゾーン';
              d['区分'] = n;
            } else d[k] = v;
          });
          l.bindPopup(makePopup('土砂災害（特別）警戒区域', d));
        }
      }).addTo(map); // 【デフォルトON】
      ctl.addOverlay(layer, '土砂災害（特別）警戒区域（2025年）');
    }
  });

  // その他の面データ (初期表示はOFF)
  const otherStyles = {
    '大規模盛土.geojson': {name: '大規模盛土（2023年）', color: '#d84315'},
    '小学校区.geojson': {name: '小学校区（2023年）', color: '#2e7d32', dash: '5,5'}
  };
  Object.entries(otherStyles).forEach(([file, opt]) => {
    fetch('./' + file).then(r=>r.json()).then(data => {
      const l = L.geoJSON(data, {
        pane: file.includes('区') ? 'boundaryPane' : 'zonesPane',
        style: {color: opt.color, weight: 2, dashArray: opt.dash || '', fillOpacity: 0.2},
        onEachFeature: (f, l) => l.bindPopup(makePopup(opt.name, f.properties))
      });
      ctl.addOverlay(l, opt.name);
    }).catch(()=>null);
  });

  // 凡例の更新（地価の追加など）
  const legend=L.control({position:'bottomright'});
  legend.onAdd=()=>{const d=L.DomUtil.create('div','legend'); d.innerHTML =
    '🐻 熊出没（過去５年）<br>'+
    '<i class="fa-solid fa-person-running" style="color:#2e7d32;"></i> 避難所<br>'+
    '<i class="fa-solid fa-car-side" style="color:#6a1b9a;"></i> 道の駅（全国2018年）<br>'+
    '🚌 バス停（2023年）<br>'+
    '<i class="fa-solid fa-yen-sign" style="color:#e65100;"></i> 地価（2025年）<br>'+
    '<i style="background:#ffff00;opacity:0.7;border:1px solid #cca300;"></i> 土砂災害：イエローゾーン<br>'+
    '<i style="background:#ff0000;opacity:0.7;border:1px solid #cc0000;"></i> 土砂災害：レッドゾーン';
    return d;};
  legend.addTo(map);

  if(L.control.locate){ L.control.locate({position:'topleft',flyTo:true,strings:{title:'現在地を表示'},locateOptions:{enableHighAccuracy:true}}).addTo(map); }
}
</script>
</body>
</html>
