<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Gifu Field Map</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet.locatecontrol@0.81.0/dist/L.Control.Locate.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet-search@3.0.9/dist/leaflet-search.min.css">

<style>
  html,body{height:100%;margin:0}
  #map{height:100%;background:#f3f3f3}
  .legend{background:#fff;box-shadow:0 0 15px rgba(0,0,0,.2);border-radius:5px;}
  .legend-header{padding:8px 12px;cursor:pointer;font-weight:bold;font-size:14px;background:#f8f9fa;text-align:center;color:#333;border-radius:5px;}
  .legend-content{padding:8px 12px;line-height:22px;}
  .legend i{width:18px;height:18px;float:left;margin-right:8px;opacity:.9}
  .map-icon {
    font-size: 18px; width: 30px; height: 30px; line-height: 30px; text-align: center;
    background: white; border-radius: 50%; border: 2px solid #333;
    transform: translate(-15px, -15px); box-shadow: 0 2px 5px rgba(0,0,0,0.3);
  }
  .search-tag{display:inline-block;margin:6px 6px 4px 6px;padding:2px 8px;border-radius:999px;font-size:12px;color:#fff;background:#e53935;line-height:1.4;vertical-align:middle;font-weight:bold;white-space:nowrap;}
  .leaflet-control-search .search-tip-list { max-height: 400px !important; }
  
  /* 旧市町村名のラベル用スタイル */
  .city-label {
    background: transparent; border: none; box-shadow: none;
    color: #37474f; font-size: 14px; font-weight: bold;
    text-shadow: 1px 1px 0 #fff, -1px -1px 0 #fff, 1px -1px 0 #fff, -1px 1px 0 #fff, 0 0 4px #fff;
    white-space: nowrap;
  }
</style>
</head>
<body>
<div id="map"></div>

<script>
function loadScript(src){return new Promise((ok,ng)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=ng;document.head.appendChild(s);});}
(async()=>{
  try{ await loadScript("https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"); }
  catch{ try{ await loadScript("https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"); }
         catch{ await loadScript("https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"); } }
  await loadScript("https://cdn.jsdelivr.net/npm/leaflet.locatecontrol@0.81.0/dist/L.Control.Locate.min.js");
  await loadScript("https://cdn.jsdelivr.net/npm/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js");
  await loadScript("https://cdn.jsdelivr.net/npm/leaflet-search@3.0.9/dist/leaflet-search.min.js");
  init();
})();

function init(){
  const map = L.map('map').setView([35.5, 137.0], 11);

  map.createPane('csPane');        map.getPane('csPane').style.zIndex = 410;
  map.createPane('boundaryPane');  map.getPane('boundaryPane').style.zIndex = 421;
  map.createPane('zonesPane');     map.getPane('zonesPane').style.zIndex = 428;
  map.createPane('markersPane');   map.getPane('markersPane').style.zIndex = 450;

  const gsiPale = L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png',{maxZoom:18,attribution:'© 国土地理院'}).addTo(map);
  const gsiPhoto = L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/seamlessphoto/{z}/{x}/{y}.jpg',{maxZoom:18,attribution:'© 国土地理院'});
  const konjakuM = L.tileLayer('https://ktgis.net/kjmapw/kjtilemap/chukyo/2man/{z}/{x}/{-y}.png', {maxZoom:16, attribution:'© 今昔マップ'});

  const baseGifu = L.tileLayer('https://forestgeo.info/opendata/21_gifu/csmap_2023/{z}/{x}/{y}.webp',{
    maxZoom:18, opacity: 0.6, pane: 'csPane', attribution:'© 岐阜県'
  });
  
  const floodL2 = L.tileLayer('https://disaportaldata.gsi.go.jp/raster/01_flood_l2_shinsuishin_data/{z}/{x}/{y}.png',{
    maxZoom:17, opacity: 0.7, attribution:'© 国土地理院'
  });

  const ctl = L.control.layers({
    '国土地理院（淡色）': gsiPale,
    '国土地理院（航空写真）': gsiPhoto,
    '今昔マップ（明治期）': konjakuM
  }, {
    '岐阜県CS立体図（2022年）': baseGifu,
    '洪水浸水想定区域（想定最大規模2020年）': floodL2
  }, {
    collapsed: window.innerWidth < 600
  }).addTo(map);
  
  L.control.scale({position:'bottomleft',imperial:false}).addTo(map);

  const makePopup = (title, props, latlng) => {
    let rows = Object.entries(props).map(([k,v])=> {
      if(k === '_searchKey') return ''; 
      return `<tr><th style="white-space:nowrap;padding-right:8px;border-bottom:1px solid #ccc;text-align:left;">${k}</th><td style="border-bottom:1px solid #ccc;">${v}</td></tr>`;
    }).join('');

    let extButtons = '';
    if (latlng) {
      const lat = latlng.lat; const lng = latlng.lng;
      extButtons = `
        <div style="margin-top:12px; padding-top:8px; border-top:1px dashed #ccc; display:flex; gap:6px;">
          <a href="https://www.google.com/maps/search/?api=1&query=${lat},${lng}" target="_blank" style="flex:1; text-align:center; background:#4285F4; color:white; padding:5px 0; border-radius:4px; text-decoration:none; font-size:11px; font-weight:bold;">
            <i class="fa-solid fa-location-dot"></i> Googleマップ
          </a>
          <a href="https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=${lat},${lng}" target="_blank" style="flex:1; text-align:center; background:#ea4335; color:white; padding:5px 0; border-radius:4px; text-decoration:none; font-size:11px; font-weight:bold;">
            <i class="fa-solid fa-street-view"></i> ｽﾄﾘｰﾄﾋﾞｭｰ
          </a>
        </div>`;
    }
    return `<b>${title}</b><br><div style="max-height:180px;overflow:auto;"><table style="border-collapse:collapse;font-size:12px;">${rows}</table></div>${extButtons}`;
  };

  const loadLayer = async (filename, layerName, options) => {
    try {
      const res = await fetch('./' + filename, {cache:'no-store'});
      if (!res.ok) return;
      const data = await res.json();
      const layer = L.geoJSON(data, {
        pane: options.pane || 'markersPane',
        pointToLayer: (f, latlng) => {
          return L.marker(latlng, {icon: L.divIcon({
            html: `<div class="map-icon" style="color:${options.iconColor || 'black'}; font-size:${options.fontSize||'18px'};">${options.iconHtml}</div>`,
            className: '', iconSize: [30,30]
          })});
        },
        onEachFeature: (f, l) => {
          let ptLatLng = null;
          if (f.geometry && f.geometry.type === 'Point') { ptLatLng = L.latLng(f.geometry.coordinates[1], f.geometry.coordinates[0]); }
          l.bindPopup(makePopup(layerName, f.properties, ptLatLng));
        }
      });
      
      const cluster = L.markerClusterGroup({pane:'markersPane', disableClusteringAtZoom:15});
      cluster.addLayer(layer);
      if(options.defaultOn) map.addLayer(cluster);
      ctl.addOverlay(cluster, layerName);
    } catch(e) { console.log(filename + " 読み込み失敗"); }
  };

  loadLayer('kuma.geojson', '熊出没（過去５年）', {iconHtml: '🐻', iconColor: '#5d4037', fontSize: '20px', defaultOn: true});
  loadLayer('避難所.geojson', '避難所', {iconHtml: '<i class="fa-solid fa-person-running"></i>', iconColor: '#2e7d32'});
  loadLayer('道の駅.geojson', '道の駅（全国2018年）', {iconHtml: '<i class="fa-solid fa-car-side"></i>', iconColor: '#6a1b9a'});
  loadLayer('バス停.geojson', 'バス停（2023年）', {iconHtml: '🚌'});
  loadLayer('地価調査.geojson', '地価（2025年）', {iconHtml: '<i class="fa-solid fa-yen-sign"></i>', iconColor: '#e65100'});

  Promise.all(['part1.geojson','part2.geojson','part3.geojson','part4.geojson','part5.geojson','part6.geojson','part7.geojson'].map(f=>fetch('./'+f,{cache:'no-store'}).then(r=>r.ok?r.json():null).catch(()=>null)))
  .then(results => {
    const valid = results.filter(r=>r);
    if(valid.length > 0) {
      const combined = { type: "FeatureCollection", features: valid.flatMap(d=>d.features) };
      const layer = L.geoJSON(combined, {
        pane: 'zonesPane',
        style: (f) => {
          const zoneVal = f.properties['区分'] ?? f.properties.A33_002;
          let col = (zoneVal == 1 || zoneVal == 3 || zoneVal == '1' || zoneVal == '3') ? '#ffff00' : '#ff0000';
          return {color: col, fillColor: col, weight: 1.5, fillOpacity: 0.5};
        },
        onEachFeature: (f, l) => {
          const p = f.properties ?? {};
          const num = p['箇所番号'] || p.A33_004 || ''; const name = p['箇所名'] || p.A33_005 || ''; const addr = p['住所'] || p['所在地'] || p.A33_009 || '';
          p._searchKey = `${num} ${name} ${addr}`.trim(); 
          let polyCenter = null; if (l.getBounds) { polyCenter = l.getBounds().getCenter(); }
          l.bindPopup(makePopup('土砂災害（特別）警戒区域', p, polyCenter));
        }
      }).addTo(map); 
      ctl.addOverlay(layer, '土砂災害（特別）警戒区域（2025年）');

      const searchCtrl = new L.Control.Search({
        layer: layer, propertyName: '_searchKey', textPlaceholder: '箇所番号 / 箇所名 / 住所',
        marker: false, zoom: 16, collapsed: window.innerWidth < 600, initial: false 
      }).addTo(map);
      searchCtrl.on('search:locationfound', function(e) { if(e.layer.openPopup) e.layer.openPopup(); });
      const el = searchCtrl._container || searchCtrl.getContainer();
      const tag = document.createElement('span'); tag.className = 'search-tag'; tag.textContent = '⚠️ 土砂災害検索'; 
      (el.querySelector('form')||el).insertBefore(tag, el.firstChild);
    }
  });

  const otherStyles = {
    'PREF_岐阜県.geojson': {name: '国土基本図郭', color: '#0288d1', weight: 1.2, fillOpacity: 0.0},
    '旧市町村.geojson': {name: '旧市町村境界', color: '#546e7a', weight: 1.2, fillOpacity: 0.1, defaultOn: true, labelField: 'city1', labelClass: 'city-label'},
    '大規模盛土.geojson': {name: '大規模盛土（2023年）', color: '#d84315', fillOpacity: 0.2},
    '小学校区.geojson': {name: '小学校区（2023年）', color: '#2e7d32', dash: '5,5', fillOpacity: 0.1},
    'R7-01号概略調査箇所.geojson': {name: 'R7-01号概略調査箇所', color: '#8e24aa', weight: 3, fillOpacity: 0.3},
    
    // ★ 名称を「砂防基盤図範囲」に変更
    '@50m.geojson': {name: '急傾斜地追加図化案', color: 'black', weight: 2, fillOpacity: 0.0},
    '@kibanzuwaku.geojson': {name: '砂防基盤図範囲', color: 'red', weight: 2, fillOpacity: 0.0},
    '@tatemono.geojson': {name: '砂防基盤図建物', color: 'green', weight: 2, fillOpacity: 0.0}
  };
  
  Object.entries(otherStyles).forEach(([file, opt]) => {
    fetch('./' + file).then(r=>r.json()).then(data => {
      const l = L.geoJSON(data, {
        pane: file.includes('区') || file.includes('旧') || file.includes('図郭') ? 'boundaryPane' : 'zonesPane',
        style: {color: opt.color, weight: opt.weight || 2, dashArray: opt.dash || '', fillOpacity: opt.fillOpacity !== undefined ? opt.fillOpacity : 0.2},
        onEachFeature: (f, layer) => {
          let center = null; if (layer.getBounds) center = layer.getBounds().getCenter();
          layer.bindPopup(makePopup(opt.name, f.properties, center));
        }
      });

      if (opt.labelField) {
        l.eachLayer(layer => {
          if (layer.feature && layer.feature.properties) {
            const key = Object.keys(layer.feature.properties).find(k => k.toLowerCase() === opt.labelField.toLowerCase());
            const labelText = key ? layer.feature.properties[key] : null;

            if (labelText && layer.getBounds) {
              const center = layer.getBounds().getCenter();
              const labelIcon = L.divIcon({
                className: opt.labelClass || 'city-label',
                html: `<span style="position:relative; left:-50%;">${labelText}</span>`,
                iconSize: [0, 0] 
              });
              L.marker(center, {icon: labelIcon, interactive: false, pane: 'markersPane'}).addTo(l);
            }
          }
        });
      }

      if(opt.defaultOn) map.addLayer(l);
      ctl.addOverlay(l, opt.name);
    }).catch(()=>null);
  });

  const legend = L.control({position:'bottomright'});
  legend.onAdd = () => {
    const d = L.DomUtil.create('div','legend'); L.DomEvent.disableClickPropagation(d);
    d.innerHTML = `
      <div class="legend-header" id="legend-header">▼ 凡例を閉じる</div>
      <div class="legend-content" id="legend-content">
        🐻 熊出没（過去５年）<br>
        <i class="fa-solid fa-person-running" style="color:#2e7d32;"></i> 避難所<br>
        <i class="fa-solid fa-car-side" style="color:#6a1b9a;"></i> 道の駅（全国2018年）<br>
        🚌 バス停（2023年）<br>
        <i class="fa-solid fa-yen-sign" style="color:#e65100;"></i> 地価（2025年）<br>
        <i style="background:#ffff00;opacity:0.7;border:1px solid #cca300;"></i> 土砂災害：イエローゾーン<br>
        <i style="background:#ff0000;opacity:0.7;border:1px solid #cc0000;"></i> 土砂災害：レッドゾーン<br>
        <i style="background:transparent;border:1px solid #546e7a;"></i> 旧市町村境界<br>
        <i style="background:transparent;border:1px solid #0288d1;"></i> 国土基本図郭<br>
        <i style="background:#8e24aa;opacity:0.3;border:2px solid #8e24aa;"></i> R7-01号概略調査箇所<br>
        <i style="background:transparent;border:2px solid black;"></i> 急傾斜地追加図化案<br>
        <i style="background:transparent;border:2px solid red;"></i> 砂防基盤図範囲<br>
        <i style="background:transparent;border:2px solid green;"></i> 砂防基盤図建物
      </div>`;
    const header = d.querySelector('#legend-header'); const content = d.querySelector('#legend-content');
    header.onclick = () => {
      if (content.style.display === 'none') { content.style.display = 'block'; header.innerText = '▼ 凡例を閉じる'; } 
      else { content.style.display = 'none'; header.innerText = '▲ 凡例を開く'; }
    };
    if (window.innerWidth < 600) { content.style.display = 'none'; header.innerText = '▲ 凡例を開く'; }
    return d;
  };
  legend.addTo(map);

  if(L.control.locate){ L.control.locate({position:'topleft',flyTo:true,strings:{title:'現在地を表示'},locateOptions:{enableHighAccuracy:true}}).addTo(map); }
}
</script>
</body>
</html>
